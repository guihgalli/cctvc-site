[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/server/**", "src/data/**"]

[[redirects]]
  from = "/api/instagram"
  to = "/.netlify/functions/instagram"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
